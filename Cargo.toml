[workspace]
resolver = "2"
members = ["crates/gift-crypto", "crates/gift-wasm", "crates/seal", "crates/server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Argon2 is painfully slow unoptimised; keep tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
