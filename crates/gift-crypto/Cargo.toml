[package]
name = "gift-crypto"
description = "Payload format, key slots and authenticated encryption shared by `seal` and the browser vault."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# default-features off: no getrandom, so the crate builds for wasm32-unknown-unknown.
# Randomness is only needed when sealing and is injected by the caller.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
hkdf = "0.12.4"
sha2 = { version = "0.10.8", default-features = false }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
unicode-normalization = "0.1.24"
base64 = "0.22.1"
rand_core = "0.6.4"

[dev-dependencies]
rand_chacha = "0.3.1"
