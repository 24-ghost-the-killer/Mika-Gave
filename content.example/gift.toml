# ─────────────────────────────────────────────────────────────────────────────
#  Stjernehimlen: the gift's content.
#
#  cp -r content.example content     (content/ is gitignored and never leaves your machine)
#  Fill in this file, put photos in content/photos/, then run:
#  cargo run -p seal --release -- content web/public/v
#
#  EVERYTHING in this file is encrypted. Nothing here is visible on the server.
# ─────────────────────────────────────────────────────────────────────────────

recipient = "Navn"                 # Her name. Shown in the intro and the letter.
domain    = "gave.example.dk"      # Host name only. Used to print the private link.

[sky]
# The moment whose sky she sees, e.g. your first evening together.
# RFC 3339 with offset: summer time in Denmark is +02:00, winter time +01:00.
when  = "2023-08-12T23:40:00+02:00"
lat   = 55.6867                    # decimal degrees, north positive
lon   = 12.5701                    # decimal degrees, east positive
place = "Dronning Louises Bro, København"

[intro]
title = "Til dig"
text  = "Jeg har samlet nogle af vores stjerner. Tryk på dem, én ad gangen."

# One [[memory]] per star. They are joined, in this order, into your constellation.
# photo is optional (JPEG/PNG/WebP; export HEIC as JPEG first). The photo lines below start with #
# so the example works without files; remove the # once your photo is in content/photos/.
# alt/az (degrees) are optional. If you leave them out, the stars are placed in an arc across the southern sky.

[[memory]]
date  = "12. august 2023"
title = "Første aften"
text  = "Du havde min jakke på hele vejen hjem."
# photo = "photos/01.jpg"   ← remove the # once the file is in content/photos/

[[memory]]
date  = "3. marts 2024"
title = "Skagen"
text  = "Hvor de to have mødes, og vi frøs og grinede."
# photo = "photos/02.jpg"

[[memory]]
date  = "24. december 2024"
title = "Jul"
text  = "Det første år med vores eget juletræ."
# photo = "photos/03.jpg"

[letter]
title     = "Kære dig"
body      = """
Skriv dit brev her.

Afsnit adskilles af en tom linje.
"""
signature = "Din, L."

# ─────────────────────────────────────────────────────────────────────────────
#  Optional extras. Delete a section to leave it out.
# ─────────────────────────────────────────────────────────────────────────────

# A quiz instead of one code: she answers these questions, and the answers together are the key.
# The QUESTIONS are public (she sees them before anything opens), so keep names and details out of them.
# You type the ANSWERS when you seal (./start.sh seal); they're never stored.
# Capitals, spaces and a full stop at the end don't matter.
[lock]
questions = [
  "Hvor mødtes vi første gang?",
  "Hvad bestilte du den aften?",
  "Hvad kalder du mig, når ingen hører det?",
]

# Her star: a real star, high in your sky that night, whose light left it around the year she was born.
[her_star]
name = "Navn"          # shown under the star
born = 1998            # her birth year
# star = "Vega"        # optional: choose the star yourself (Vega, Altair, Arcturus, Capella, Pollux, …)
# text = "Den har været på vej mod dig, siden du blev født."   # optional extra words

# Advent calendar: up to 24 doors, one per day 1–24 December. Each door opens at midnight
# (Danish time) on its day, and not a second before: the server only hands out a door's key on
# its date, and the key alone opens nothing without the gift's own key.
# The doors form a Christmas tree in the sky; door 24 is the star on top.
[advent]
year = 2026

[[advent.door]]
day   = 1
title = "Første låge"
text  = "God morgen. I dag starter vi en lille tradition."
# photo = "photos/advent-01.jpg"

[[advent.door]]
day   = 2
title = "Et løfte"
text  = "Morgenmad på sengen i weekenden. Du vælger."

[[advent.door]]
day   = 24
title = "Juleaften"
text  = "Den sidste stjerne. Glædelig jul, min skat."
